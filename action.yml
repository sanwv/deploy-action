name: Rsync Deploy with Releases and Rollback
author: sanwv
description: Fast incremental rsync over SSH with atomic release switching, rollback, and shared files
branding:
  icon: upload-cloud
  color: blue
inputs:
  ssh_private_key:
    description: SSH private key used to connect to the server
    required: true
  ssh_known_hosts:
    description: Verified SSH host keys in known_hosts format
    required: false
    default: ''
  ssh_host:
    description: 'SSH connection target: user@host or user@host:port (default port 22; bracket IPv6 addresses)'
    required: true
  source:
    description: Runner directory containing built files
    required: true
  target:
    description: Remote deployment root directory
    required: true
  exclude:
    description: Multiline rsync exclude patterns relative to source
    required: false
    default: ''
  releases_to_keep:
    description: Number of releases to retain, including the active release (1-100)
    required: false
    default: '5'
  shared_items:
    description: Multiline shared item configuration
    required: false
    default: ''
  script_before:
    description: Remote shell script run before synchronizing a release
    required: false
    default: ''
  script_before_activate:
    description: Remote shell script run after release preparation and before activating it
    required: false
    default: ''
  script_after:
    description: Remote shell script run after activation and before old release cleanup
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: Deploy release
      shell: bash
      env:
        INPUT_SSH_PRIVATE_KEY: ${{ inputs.ssh_private_key }}
        INPUT_SSH_KNOWN_HOSTS: ${{ inputs.ssh_known_hosts }}
        INPUT_SSH_HOST: ${{ inputs.ssh_host }}
        INPUT_SOURCE: ${{ inputs.source }}
        INPUT_TARGET: ${{ inputs.target }}
        INPUT_EXCLUDE: ${{ inputs.exclude }}
        INPUT_RELEASES_TO_KEEP: ${{ inputs.releases_to_keep }}
        INPUT_SHARED_ITEMS: ${{ inputs.shared_items }}
        INPUT_SCRIPT_BEFORE: ${{ inputs.script_before }}
        INPUT_SCRIPT_BEFORE_ACTIVATE: ${{ inputs.script_before_activate }}
        INPUT_SCRIPT_AFTER: ${{ inputs.script_after }}
      run: "$GITHUB_ACTION_PATH/deploy.sh"
